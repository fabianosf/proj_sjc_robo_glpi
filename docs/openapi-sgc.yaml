openapi: 3.1.0
info:
  title: SGC API
  description: 'API do painel web do SGC: leituras operacionais para perfis autorizados;
    escritas delimitadas a ADMIN (técnicos, redirect GLPI, matrícula, regras). Isolada
    do worker de atribuição. Rotas /api/v1 exigem JWT (exceto /api/v1/auth/login).'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
      security:
      - HTTPBearer: []
  /api/v1/dashboard/summary:
    get:
      tags:
      - api-v1
      summary: Dashboard Summary
      operationId: dashboard_summary_api_v1_dashboard_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
      security:
      - HTTPBearer: []
  /api/v1/tickets:
    get:
      tags:
      - api-v1
      summary: Tickets
      operationId: tickets_api_v1_tickets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página (>= 1)
          default: 1
          title: Page
        description: Página (>= 1)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por página (1–100)
          default: 20
          title: Page Size
        description: Itens por página (1–100)
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/glpi:
    get:
      tags:
      - api-v1
      summary: Tickets Glpi
      description: Chamados ativos do GLPI (status=notold) — mesma busca do front
        ticket.php.
      operationId: tickets_glpi_api_v1_tickets_glpi_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}:
    get:
      tags:
      - api-v1
      summary: Ticket Detail
      operationId: ticket_detail_api_v1_tickets__ticket_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: integer
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/glpi-hint:
    get:
      tags:
      - api-v1
      summary: Ticket Glpi Hint
      description: 'Quando o chamado não está no SGC: consulta GLPI (só leitura) para
        explicar atribuição.'
      operationId: ticket_glpi_hint_api_v1_tickets__ticket_id__glpi_hint_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: integer
          title: Ticket Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketGlpiHint'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tickets/{ticket_id}/reassign:
    post:
      tags:
      - api-v1
      summary: Reassign Ticket Route
      description: 'ADMIN: envia um chamado para outra fila (equipe) ou para uma pessoa.'
      operationId: reassign_ticket_route_api_v1_tickets__ticket_id__reassign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: integer
          title: Ticket Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReassign'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReassignResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/teams:
    get:
      tags:
      - api-v1
      summary: Teams
      operationId: teams_api_v1_teams_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamItem'
                type: array
                title: Response Teams Api V1 Teams Get
      security:
      - HTTPBearer: []
  /api/v1/teams/guide:
    get:
      tags:
      - api-v1
      summary: Teams Guide
      description: O que cada fila faz (resumo + exemplos do arqaux) para ajudar no
        redirect.
      operationId: teams_guide_api_v1_teams_guide_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamGuideItem'
                type: array
                title: Response Teams Guide Api V1 Teams Guide Get
      security:
      - HTTPBearer: []
  /api/v1/technicians:
    get:
      tags:
      - api-v1
      summary: Technicians
      operationId: technicians_api_v1_technicians_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TechnicianItem'
                type: array
                title: Response Technicians Api V1 Technicians Get
      security:
      - HTTPBearer: []
  /api/v1/technicians/{usuario}:
    patch:
      tags:
      - api-v1
      summary: Patch Technician
      description: Atualiza equipe/situação/matrícula (e horário/empresa) em Tb_Atrib.
        Somente ADMIN.
      operationId: patch_technician_api_v1_technicians__usuario__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: usuario
        in: path
        required: true
        schema:
          type: string
          title: Usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/technicians/redirect:
    post:
      tags:
      - api-v1
      summary: Redirect Technician Route
      description: 'Redireciona login de atribuição: move tickets locais, notifica
        destino e opcionalmente desativa origem.'
      operationId: redirect_technician_route_api_v1_technicians_redirect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianRedirect'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianRedirectResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/technicians/sync-matriculas:
    post:
      tags:
      - api-v1
      summary: Sync Matriculas Route
      description: 'Sincroniza matrículas: Oracle Globus → GLPI (nome exato) → AD
        → mapa .env.'
      operationId: sync_matriculas_route_api_v1_technicians_sync_matriculas_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaSyncResult'
      security:
      - HTTPBearer: []
  /api/v1/technicians/import-matriculas:
    post:
      tags:
      - api-v1
      summary: Import Matriculas Route
      description: Importa CSV usuario;matricula (ou vírgula) para Tb_Atrib.Matricula.
        Somente ADMIN.
      operationId: import_matriculas_route_api_v1_technicians_import_matriculas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatriculaImportBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaImportResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/rules:
    get:
      tags:
      - api-v1
      summary: Get Rules
      description: Lista regras palavra-chave → equipe [@técnico] do arqaux.txt.
      operationId: get_rules_api_v1_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RuleItem'
                type: array
                title: Response Get Rules Api V1 Rules Get
      security:
      - HTTPBearer: []
    put:
      tags:
      - api-v1
      summary: Put Rules
      description: Substitui arqaux.txt (com backup .bak). Ordem da lista = prioridade
        DIRETO.
      operationId: put_rules_api_v1_rules_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesPutBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RuleItem'
                type: array
                title: Response Put Rules Api V1 Rules Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ml/overview:
    get:
      tags:
      - api-v1
      summary: Ml Overview
      operationId: ml_overview_api_v1_ml_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlOverview'
      security:
      - HTTPBearer: []
  /api/v1/ml/model-status:
    get:
      tags:
      - api-v1
      summary: Ml Model Status
      operationId: ml_model_status_api_v1_ml_model_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlModelStatus'
      security:
      - HTTPBearer: []
  /api/v1/ml/corrections:
    get:
      tags:
      - api-v1
      summary: Ml Corrections
      operationId: ml_corrections_api_v1_ml_corrections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: equipe_sgc
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          title: Equipe Sgc
      - name: equipe_correta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          title: Equipe Correta
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMlCorrections'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/accuracy-by-method:
    get:
      tags:
      - api-v1
      summary: Ml Accuracy
      operationId: ml_accuracy_api_v1_ml_accuracy_by_method_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlAccuracyReport'
      security:
      - HTTPBearer: []
  /api/v1/ml/logs:
    get:
      tags:
      - api-v1
      summary: Ml Logs
      operationId: ml_logs_api_v1_ml_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: metodo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 24
          - type: 'null'
          title: Metodo
      - name: equipe
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          title: Equipe
      - name: rejeitados
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Rejeitados
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMlLogs'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ml/simulate:
    post:
      tags:
      - api-v1
      summary: Ml Simulate
      operationId: ml_simulate_api_v1_ml_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlSimulateBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlSimulateResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/jobs:
    get:
      tags:
      - api-v1
      summary: Jobs
      operationId: jobs_api_v1_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsOverview'
      security:
      - HTTPBearer: []
  /api/v1/reports/ops:
    get:
      tags:
      - api-v1
      summary: Ops Period Report
      operationId: ops_period_report_api_v1_reports_ops_get
      security:
      - HTTPBearer: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          description: day | week | month | custom
          default: week
          title: Period
        description: day | week | month | custom
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Data de referência YYYY-MM-DD (dia / qualquer dia da semana
            / mês).
          title: Date
        description: Data de referência YYYY-MM-DD (dia / qualquer dia da semana /
          mês).
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Início do intervalo YYYY-MM-DD (com date_to ou period=custom).
          title: Date From
        description: Início do intervalo YYYY-MM-DD (com date_to ou period=custom).
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Fim do intervalo YYYY-MM-DD (inclusivo).
          title: Date To
        description: Fim do intervalo YYYY-MM-DD (inclusivo).
      - name: equipes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'CSV de equipes (ex.: N1,N2,N3,DEV). Vazio = default + outras
            com movimento.'
          title: Equipes
        description: 'CSV de equipes (ex.: N1,N2,N3,DEV). Vazio = default + outras
          com movimento.'
      - name: tecnico
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          description: Login do técnico (filtra relatório para uma pessoa).
          title: Tecnico
        description: Login do técnico (filtra relatório para uma pessoa).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsPeriodReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/ops.pdf:
    get:
      tags:
      - api-v1
      summary: Ops Period Report Pdf
      operationId: ops_period_report_pdf_api_v1_reports_ops_pdf_get
      security:
      - HTTPBearer: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          description: day | week | month | custom
          default: week
          title: Period
        description: day | week | month | custom
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Data de referência YYYY-MM-DD (dia / qualquer dia da semana
            / mês).
          title: Date
        description: Data de referência YYYY-MM-DD (dia / qualquer dia da semana /
          mês).
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Início do intervalo YYYY-MM-DD (com date_to ou period=custom).
          title: Date From
        description: Início do intervalo YYYY-MM-DD (com date_to ou period=custom).
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Fim do intervalo YYYY-MM-DD (inclusivo).
          title: Date To
        description: Fim do intervalo YYYY-MM-DD (inclusivo).
      - name: equipes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'CSV de equipes (ex.: N1,N2,N3,DEV). Vazio = default + outras
            com movimento.'
          title: Equipes
        description: 'CSV de equipes (ex.: N1,N2,N3,DEV). Vazio = default + outras
          com movimento.'
      - name: tecnico
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          description: Login do técnico (filtra relatório para uma pessoa).
          title: Tecnico
        description: Login do técnico (filtra relatório para uma pessoa).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/ops.csv:
    get:
      tags:
      - api-v1
      summary: Ops Period Report Csv
      operationId: ops_period_report_csv_api_v1_reports_ops_csv_get
      security:
      - HTTPBearer: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          default: week
          title: Period
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: equipes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Equipes
      - name: tecnico
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Tecnico
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/assertividade:
    get:
      tags:
